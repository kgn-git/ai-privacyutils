# Publish workflow — triggered on tag push v*.*.*.
#
# Flow:
#   1. verify-tag — hard-checks tag version matches package.json; soft-warns
#                   if tag is not GPG-signed (S3 deferred per reduced-tier
#                   security decision 2026-04-19; see docs/Handover-35.md
#                   § Security Posture Decision). Upgrade path: remove
#                   `continue-on-error` on the GPG step and tighten to a
#                   hard fail when S3 is applied.
#   2. publish    — npm ci → build → test → redos:scan → npm publish
#                   --provenance --access restricted to GitHub Packages,
#                   then actions/attest-build-provenance@v2.3.0 attests the
#                   dist/** artefacts to Sigstore Rekor (S4).
#
# Permissions are narrowed to the minimum required for OIDC-based
# provenance publishing. All action SHAs pinned.

name: Publish

on:
  push:
    tags: ['v*.*.*']

permissions:
  contents: read
  id-token: write
  packages: write
  attestations: write

concurrency:
  group: publish-${{ github.ref }}
  cancel-in-progress: false

jobs:
  verify-tag:
    runs-on: ubuntu-24.04
    steps:
      - name: Checkout (full history for tag verification)
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with:
          fetch-depth: 0
      - name: Verify tag version matches package.json
        run: |
          TAG="${GITHUB_REF#refs/tags/v}"
          PKG_VERSION=$(node -p "require('./package.json').version")
          echo "Tag version: $TAG"
          echo "package.json version: $PKG_VERSION"
          if [ "$TAG" != "$PKG_VERSION" ]; then
            echo "::error::Tag $TAG does not match package.json version $PKG_VERSION. Aborting publish."
            exit 1
          fi
          echo "Tag $TAG matches package.json version."
      - name: Verify tag GPG signature (soft — S3 deferred)
        continue-on-error: true
        run: |
          TAG="${GITHUB_REF#refs/tags/}"
          if git verify-tag "$TAG" 2>/dev/null; then
            echo "Tag $TAG is GPG-signed — full S3 posture."
          else
            echo "::warning::Tag $TAG is not GPG-signed. S3 deferred per reduced-tier security decision 2026-04-19 (see docs/Handover-35.md § Security Posture Decision). Upgrade path: apply GPG-signed tag workflow + tighten this step to a hard fail."
          fi

  publish:
    needs: verify-tag
    runs-on: ubuntu-24.04
    steps:
      - name: Checkout
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with:
          fetch-depth: 0
      - name: Setup Node.js (with GitHub Packages registry)
        uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4.4.0
        with:
          node-version: '20'
          registry-url: 'https://npm.pkg.github.com'
          scope: '@kgn-git'
          cache: 'npm'
      - name: Install dependencies
        run: npm ci
      - name: Build
        run: npm run build
      - name: Test
        run: npm test
      - name: ReDoS scan (last pre-publish gate)
        run: npm run redos:scan
      - name: Publish to GitHub Packages with provenance
        run: npm publish --provenance --access restricted
        env:
          NODE_AUTH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
      - name: Attest build provenance for dist artefacts
        uses: actions/attest-build-provenance@db473fddc028af60658334401dc6fa3ffd8669fd # v2.3.0
        with:
          # IMP-6: attest .d.ts, .d.ts.map, and .js.map alongside .js so a
          # type-declaration substitution is covered by the Sigstore Rekor
          # record, not just the runtime JS.
          subject-path: 'dist/**'
