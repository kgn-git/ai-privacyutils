# CI workflow — runs on every PR + push to main.
#
# Gates (all MUST pass for merge per branch-ruleset main-protected):
#   1. lint        — ESLint + eslint-plugin-redos
#   2. typecheck   — tsc --noEmit
#   3. test        — vitest run with coverage
#   4. redos-scan  — recheck v4.x programmatic scan over src/patterns.ts
#   5. audit       — npm audit --audit-level=high --omit=dev
#   6. dependency-review — actions/dependency-review-action@v4 (PR-only)
#
# All action SHAs are pinned to commit SHAs (S4 per security review).
# Workflow permissions are narrowed to the minimum; id-token and
# packages write are NOT required in CI (only in publish.yml).

name: CI

on:
  pull_request:
    branches: [main]
  push:
    branches: [main]

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  lint:
    runs-on: ubuntu-24.04
    steps:
      - name: Checkout
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
      - name: Setup Node.js
        uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4.4.0
        with:
          node-version: '20'
          cache: 'npm'
      - name: Install dependencies
        run: npm ci
      - name: Lint (eslint + eslint-plugin-redos)
        run: npm run lint

  typecheck:
    runs-on: ubuntu-24.04
    steps:
      - name: Checkout
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
      - name: Setup Node.js
        uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4.4.0
        with:
          node-version: '20'
          cache: 'npm'
      - name: Install dependencies
        run: npm ci
      - name: Build (tsc emit check)
        run: npm run build

  test:
    runs-on: ubuntu-24.04
    steps:
      - name: Checkout
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
      - name: Setup Node.js
        uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4.4.0
        with:
          node-version: '20'
          cache: 'npm'
      - name: Install dependencies
        run: npm ci
      - name: Run vitest with coverage
        run: npm run test:coverage

  redos-scan:
    runs-on: ubuntu-24.04
    steps:
      - name: Checkout
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
      - name: Setup Node.js
        uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4.4.0
        with:
          node-version: '20'
          cache: 'npm'
      - name: Install dependencies
        run: npm ci
      - name: Build (scanner reads dist/patterns.js)
        run: npm run build
      - name: ReDoS scan with recheck v4.x
        run: npm run redos:scan

  audit:
    runs-on: ubuntu-24.04
    steps:
      - name: Checkout
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
      - name: Setup Node.js
        uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4.4.0
        with:
          node-version: '20'
          cache: 'npm'
      - name: npm audit (high/critical in prod deps)
        run: npm audit --audit-level=high --omit=dev

  dependency-review:
    # Fails the PR if any new/updated dependency has a high/critical CVE
    # or an incompatible copyleft licence. Runs on PR events only.
    runs-on: ubuntu-24.04
    if: github.event_name == 'pull_request'
    # IMP-4: scope the extra permission for comment-summary-in-pr at the
    # job level so the workflow-wide default stays at the least-privilege
    # `contents: read`. `pull-requests: write` is required for the action
    # to leave its summary comment on the PR.
    permissions:
      contents: read
      pull-requests: write
    steps:
      - name: Checkout
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
      - name: Dependency review
        uses: actions/dependency-review-action@da24556b548a50705dd671f47852072ea4c105d9 # v4.7.1
        with:
          fail-on-severity: high
          deny-licenses: GPL-2.0, GPL-3.0, AGPL-3.0
          comment-summary-in-pr: always
